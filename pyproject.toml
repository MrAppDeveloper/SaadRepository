[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebula-agent"
version = "0.1.0"
description = "CLI for AI agents that automate data analytics and cleaning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
nebula-agent = "nebula_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
